[package]
authors = [ "Kayla & Zahra <kaylamutiara1206@gmail.com & azkiyaz65@gmail.com>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Parser bahasa filter sederhana untuk membuat aturan penyaringan data."
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "filter" ]
license = "MIT"
name = "tree-sitter-filter"
readme = "README.md"
repository = "https://github.com/yayyzea/tree-sitter_108_124"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.2"
